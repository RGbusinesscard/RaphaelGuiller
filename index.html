<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ludovic Robert – Denis Lebesle</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#020617;
  overflow:hidden;
  color:#fff;
}

/* FOND ANIMÉ MÉMORABLE */
.bg{
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 0% 0%, #b21f2d33, transparent 55%),
    radial-gradient(circle at 100% 100%, #1d4ed833, transparent 55%),
    radial-gradient(circle at 50% 120%, #0f172a, #020617);
  background-size:160% 160%;
  animation:bgMove 14s ease-in-out infinite;
  z-index:-3;
}
@keyframes bgMove{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

/* AURAS FLOTTANTES */
.aura{
  position:absolute;
  width:420px;
  height:420px;
  border-radius:50%;
  background:radial-gradient(circle,#b21f2d55,transparent 70%);
  filter:blur(42px);
  animation:float 7s ease-in-out infinite;
  z-index:-2;
}
.aura.aura-right{
  right:-60px;
  bottom:-40px;
  background:radial-gradient(circle,#1d4ed855,transparent 70%);
}
@keyframes float{
  0%{transform:translate(-30px,-10px);}
  50%{transform:translate(25px,18px);}
  100%{transform:translate(-30px,-10px);}
}

/* CARTE MÉMORABLE : 3D + flottement */
.card-shell{
  perspective:1200px;
  width:100%;
  max-width:440px;
  padding:22px;
}

.card{
  width:100%;
  padding:26px 22px 24px;
  border-radius:26px;
  backdrop-filter:blur(16px);
  background:linear-gradient(135deg,rgba(15,23,42,0.92),rgba(15,23,42,0.8));
  border:1px solid rgba(148,163,184,0.4);
  box-shadow:
    0 24px 60px rgba(0,0,0,0.7),
    0 0 0 1px rgba(15,23,42,0.6);
  animation:popIn .7s ease, cardFloat 9s ease-in-out infinite;
  transform-origin:center center;
}
@keyframes popIn{
  from{opacity:0;transform:translateY(18px) scale(.94) rotateX(6deg);}
  to{opacity:1;transform:translateY(0) scale(1) rotateX(0);}
}
@keyframes cardFloat{
  0%{transform:translateY(0) rotateX(0deg) rotateY(0deg);}
  50%{transform:translateY(-6px) rotateX(4deg) rotateY(-3deg);}
  100%{transform:translateY(0) rotateX(0deg) rotateY(0deg);}
}

/* LOGO AVEC HALO */
.logo-wrapper{
  display:flex;
  justify-content:center;
  margin-bottom:18px;
  position:relative;
}
.logo-ring{
  position:absolute;
  width:210px;
  height:210px;
  border-radius:999px;
  background:radial-gradient(circle,rgba(248,250,252,0.12),transparent 65%);
  filter:blur(12px);
  z-index:0;
}
.logo{
  position:relative;
  z-index:1;
  padding:6px;
  border-radius:20px;
  background:linear-gradient(135deg,rgba(15,23,42,0.9),rgba(30,64,175,0.75));
  box-shadow:0 12px 30px rgba(15,23,42,0.9);
}
.logo img{
  width:200px;
  display:block;
  border-radius:14px;
  background:#fff;
}

/* INFOS */
.infos{
  text-align:center;
  margin:18px 0 22px;
}
.infos .societe{
  text-transform:uppercase;
  letter-spacing:.14em;
  font-size:.72rem;
  color:#9ca3af;
  margin-bottom:4px;
}
.infos .nom{
  font-size:1.28rem;
  font-weight:600;
  color:#e5e7eb;
}
.infos .poste{
  font-size:.9rem;
  color:#9ca3af;
  margin-top:4px;
}

.divider{
  height:1px;
  width:100%;
  margin:4px 0 18px;
  background:linear-gradient(90deg,transparent,#64748b66,transparent);
}

/* BOUTONS RONDS */
.actions{
  display:flex;
  justify-content:center;
  gap:14px;
  margin-bottom:18px;
}

.icon-btn{
  width:52px;
  height:52px;
  border-radius:999px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-decoration:none;
  font-size:1.7rem;
  color:#f9fafb;
  background:radial-gradient(circle at 30% 0%,rgba(248,250,252,0.3),rgba(15,23,42,0.9));
  border:1px solid rgba(148,163,184,0.7);
  box-shadow:0 14px 26px rgba(15,23,42,0.8);
  transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease;
}
.icon-btn:active{
  transform:translateY(2px) scale(.96);
  box-shadow:0 8px 14px rgba(15,23,42,0.8);
}

.icon-btn.phone{
  background:radial-gradient(circle at 30% 0%,rgba(248,250,252,0.25),rgba(185,28,28,0.95));
  border-color:rgba(248,113,113,0.85);
}
.icon-btn.mail{
  background:radial-gradient(circle at 30% 0%,rgba(248,250,252,0.25),rgba(59,130,246,0.95));
  border-color:rgba(96,165,250,0.85);
}
.icon-btn.web{
  background:radial-gradient(circle at 30% 0%,rgba(248,250,252,0.25),rgba(16,185,129,0.95));
  border-color:rgba(52,211,153,0.9);
}

/* MAP */
.map-card{
  margin-top:8px;
  border-radius:20px;
  overflow:hidden;
  border:1px solid rgba(148,163,184,0.6);
  background:radial-gradient(circle at 0 0,rgba(148,163,184,0.18),rgba(15,23,42,0.9));
  box-shadow:0 16px 32px rgba(15,23,42,0.9);
}
.map-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 12px 4px;
}
.map-title{
  font-size:.78rem;
  text-transform:uppercase;
  letter-spacing:.12em;
  color:#e5e7eb;
}
.map-tag{
  font-size:.65rem;
  padding:2px 8px;
  border-radius:999px;
  border:1px solid rgba(148,163,184,0.9);
  color:#cbd5e1;
}
.map-frame-wrapper{
  width:100%;
  height:220px;
}
.map-frame-wrapper iframe{
  border:0;
  width:100%;
  height:100%;
  display:block;
}

/* FOOTER */
.bottom{
  text-align:center;
  margin-top:16px;
  color:#9ca3af;
  font-size:.72rem;
}

@media (max-width:380px){
  .card{padding:22px 18px 22px;}
  .logo img{width:180px;}
  .map-frame-wrapper{height:200px;}
}
</style>
</head>

<body>

<div class="bg"></div>
<div class="aura"></div>
<div class="aura aura-right"></div>

<div class="card-shell">
  <div class="card">

    <!-- LOGO -->
    <div class="logo-wrapper">
      <div class="logo-ring"></div>
      <div class="logo">
        <img src="IMG_7657.jpg" alt="Ludovic Robert - Artisan Plaquiste">
      </div>
    </div>

    <!-- INFOS -->
    <div class="infos">
      <div class="societe">Société LUDOVIC ROBERT</div>
      <div class="nom">Denis Lebesle</div>
      <div class="poste">Chargé d’affaire</div>
    </div>

    <div class="divider"></div>

    <!-- BOUTONS -->
    <div class="actions">
      <a href="tel:0673865797" class="icon-btn phone">📞</a>
      <a href="mailto:dlebesle@robert-platrerie.fr" class="icon-btn mail">✉️</a>
      <a href="https://www.robert-platriere-lemans.fr" class="icon-btn web" target="_blank">🌐</a>
    </div>

    <!-- MAP -->
    <div class="map-card">
      <div class="map-header">
        <div class="map-title">Localisation</div>
        <div class="map-tag">Google Maps</div>
      </div>
      <div class="map-frame-wrapper">
        <iframe
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
          src="https://www.google.com/maps?q=Ludovic+Robert+Artisan+Plaquiste+Le+Mans&output=embed">
        </iframe>
      </div>
    </div>

    <div class="bottom">Carte de visite dématérialisée – Ludovic Robert</div>
  </div>
</div>

</body>
</html>
